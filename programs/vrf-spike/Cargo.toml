[package]
name = "vrf-spike"
version = "0.1.0"
description = "PIG-114 spike: ORAO VRF request, fulfill and consume on devnet"
repository = "https://github.com/piggygang/raffles-program"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "vrf_spike"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
# Exact pins, like programs/raffles.
anchor-lang = "=1.2.2"
# `cpi` alone: the client half (`sdk`) needs solana-rpc-client 4.3, which needs
# Rust 1.97. The Solana cohort follows anchor-lang's.
orao-solana-vrf = { version = "=0.8.1", default-features = false, features = ["cpi"] }
solana-sha256-hasher = "3"

# Off-chain (tests, the driver, the IDL build) sha256 needs the `sha2` backend;
# the program uses the syscall.
[target.'cfg(not(target_os = "solana"))'.dependencies]
solana-sha256-hasher = { version = "3", features = ["sha2"] }

[dev-dependencies]
base64 = "0.22"
# `precompiles`: ORAO fulfills through the Ed25519 precompile.
litesvm = { version = "0.16.0", features = ["precompiles"] }
serde_json = "1"
solana-account = "4"
solana-keypair = "3"
solana-message = "4"
solana-sdk-ids = "3"
solana-signer = "3"
solana-transaction = "4"

[lints]
workspace = true
