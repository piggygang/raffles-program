[package]
name = "claim-spike"
version = "0.1.0"
description = "PIG-133 spike: claim_entries holder proofs and receipts, measured for compute and transaction size"
repository = "https://github.com/piggygang/raffles-program"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "claim_spike"

[features]
# The wallet's EntryPosition opens with its first claim.
default = ["init-if-needed"]
init-if-needed = ["anchor-lang/init-if-needed"]
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
# Exact pins, like programs/raffles.
anchor-lang = "=1.2.2"
# Token accounts, and mpl-token-metadata's `Metadata` for the full-decode
# variant. The claim itself decodes only the prefix the rule reads.
anchor-spl = { version = "=1.2.2", features = ["metadata"] }

[dev-dependencies]
base64 = "0.22"
bincode = "1"
litesvm = "0.16.0"
serde_json = "1"
solana-account = "4"
solana-address-lookup-table-interface = { version = "3", features = ["bincode"] }
solana-compute-budget-interface = "3"
solana-keypair = "3"
solana-message = "4"
solana-signer = "3"
# `serde`, so bincode can measure a transaction's wire size.
solana-transaction = { version = "4", features = ["serde"] }

[lints]
workspace = true
