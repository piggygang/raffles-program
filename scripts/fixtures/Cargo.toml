[package]
name = "fixtures"
version = "0.1.0"
description = "PIG-115: devnet stand-ins for the Piggy collections, prize assets and test wallets"
repository = "https://github.com/piggygang/raffles-program"
edition = "2021"
rust-version = "1.95"
publish = false

# Its own workspace, outside the program workspace: `cargo build-sbf` builds
# every workspace member for SBF, and an RPC client doesn't compile there.
[workspace]
resolver = "3"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
mpl-core = "0.12.1"
# The Solana 3 build anchor-spl pins for the program; 5.1.1 is still Solana 2.
mpl-token-metadata = "=5.1.2-alpha.2"
serde_json = "1"
# Agave 4.2, as spikes/vrf-driver: 4.3 needs Rust 1.97.
solana-account = "4"
solana-commitment-config = "3"
solana-compute-budget-interface = "3"
solana-instruction = "3"
solana-keypair = "3"
solana-message = "4"
solana-program-pack = "3"
solana-pubkey = "3"
solana-rpc-client = "~4.2"
solana-rpc-client-api = "~4.2"
solana-sha256-hasher = { version = "3", features = ["sha2"] }
solana-signature = "3"
solana-signer = "3"
solana-system-interface = { version = "3", features = ["bincode"] }
solana-transaction = "4"
spl-associated-token-account-interface = "2"
spl-token-interface = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
